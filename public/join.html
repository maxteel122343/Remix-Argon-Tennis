<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argon Tennis • Join Match</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Rounded Mplus 1c", "Nunito", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1d4e89, #091526 75%); color: #fff; padding: 20px;
    }
    .card {
      width: min(400px, 94vw); padding: 26px; border-radius: 24px;
      background: rgba(255, 255, 255, 0.96); color: #1b2a3a; text-align: center;
      border: 4px solid #5cb8ff; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0 0 8px; font-size: 26px; color: #006cc4; }
    p { margin: 0 0 18px; font-size: 14px; font-weight: 700; color: #4c6278; }
    .btn {
      display: block; text-decoration: none; padding: 13px 18px; border-radius: 999px;
      font-weight: 900; font-size: 15px; margin-top: 10px; color: #fff;
      background: linear-gradient(180deg, #5cc4ff, #0072d6);
    }
    .btn.secondary { background: linear-gradient(180deg, #74cc3d, #3c8c14); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎾 Argon Tennis</h1>
    <p id="room-desc">Join Live Session</p>
    <a id="link-racket" class="btn secondary" href="/companion.html">Open Pocket Racket (Phone)</a>
    <a id="link-court" class="btn" href="/">Open 3D Stadium Court</a>
  </div>
  <script>
    (function () {
      const p = new URLSearchParams(window.location.search);
      const room = (p.get('room') || '').trim().toUpperCase();
      const role = (p.get('role') || 'p2').trim().toLowerCase() === 'p1' ? 'p1' : 'p2';
      if (room && room !== 'DEFAULT') {
        document.getElementById('room-desc').textContent = `Room #${room} • ${role === 'p2' ? 'Player 2' : 'Player 1'}`;
        document.getElementById('link-racket').href = `/companion.html?room=${encodeURIComponent(room)}&role=${role}`;
        document.getElementById('link-court').href = `/?room=${encodeURIComponent(room)}&role=${role}`;
      }
    })();
  </script>
</body>
</html>
